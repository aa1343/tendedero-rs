<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Tendedero (Rust)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <!-- Action controls at top right: + New Todo, 📸 Screenshot, 🔍 Search -->
    <div id="topControls" class="interactive-zone">
      <button id="btnNewTodo" class="top-btn" title="新建待办便签 (Ctrl+Alt+N)">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        <span>新建便签</span>
      </button>
      <button id="btnCapture" class="top-btn" title="立即截屏挂绳 (Ctrl+Alt+S)">
        <svg viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
        <span>截屏</span>
      </button>
      <button id="btnSearch" class="top-btn" title="绳上搜索 (Ctrl+Alt+F)">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span>搜索</span>
      </button>
      <button id="btnDataFolder" class="top-btn" title="打开数据目录">
        <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
      </button>
    </div>

    <!-- The Rope & Cards -->
    <div id="lineRoot">
      <svg id="rope" width="100%" height="60"></svg>
      <div id="cards"></div>
      <div id="knot"><svg width="12" height="18" viewBox="0 0 12 18"></svg></div>
      <div id="hint">暂无卡片，按 Ctrl+Alt+S 截屏或按 Ctrl+Alt+N 新建待办便签</div>
    </div>

    <!-- Modals: Search, Todo Detail, Toast -->
    <div id="modalOverlay" class="interactive-zone" style="display: none;">
      <!-- Search Modal -->
      <div id="searchModal" class="modal-box" style="display: none;">
        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24" class="search-icon"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="searchInput" placeholder="搜索卡片、文字、待办事项 (Esc 关闭)..." />
        </div>
        <div id="searchResults" class="search-results"></div>
      </div>

      <!-- Todo Detail / Edit Modal -->
      <div id="todoDetailModal" class="modal-box todo-detail-box" style="display: none;">
        <div class="modal-header">
          <input type="text" id="modalTodoTitle" class="todo-title-input" placeholder="便签标题..." />
          <div class="color-picker" id="modalColorPicker">
            <span class="color-dot yellow active" data-color="yellow"></span>
            <span class="color-dot green" data-color="green"></span>
            <span class="color-dot blue" data-color="blue"></span>
            <span class="color-dot pink" data-color="pink"></span>
            <span class="color-dot purple" data-color="purple"></span>
          </div>
          <button id="btnCloseModal" class="modal-close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div id="modalTodoList" class="todo-item-list"></div>
          <div class="todo-add-row">
            <input type="text" id="modalNewItemInput" placeholder="+ 输入待办内容并按回车添加..." />
          </div>
        </div>
        <div class="modal-footer">
          <span id="modalTodoStats">0/0 已完成</span>
          <button id="btnSaveTodoModal" class="btn-primary">完成</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">已复制到剪贴板！</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
